## Settings file was created by plugin Better Networking 1.0 Safe v1.2.0
## Plugin GUID: DIT.BetterNetworking10

[00 - Compatibility]

## Balanced: the enabled feature switches below are applied. VanillaSafe: only compression is allowed; ZDO scheduling, queue, and Steam send-rate changes are disabled.
# Setting type: CompatibilityMode
# Default value: Balanced
# Acceptable values: Balanced, VanillaSafe
Mode = Balanced

[01 - Features]

## Compress traffic only when both peers run this compatible build.
# Setting type: Boolean
# Default value: true
Compression = true

## Changes the ZDO send budget directly. Disabled in VanillaSafe mode.
# Setting type: Boolean
# Default value: true
Queue Size = true

## Allows a lower ZDO update frequency. Disabled in VanillaSafe mode.
# Setting type: Boolean
# Default value: true
Update Rate = true

## Changes Steamworks send-rate limits. Has no effect with PlayFab/crossplay. Disabled in VanillaSafe mode.
# Setting type: Boolean
# Default value: true
Steam Send Rate = true

## Experimental. Buffers early ZDOData packets per connection until ZDOMan registers the peer. OFF by default because stale player/ZDO state is being diagnosed.
# Setting type: Boolean
# Default value: false
New Connection ZDO Buffer = false

## Optional server-side portal observer refresh. Re-sends a teleported player's ZDO and related networked status-effect ZDOs; vanilla clients are supported. Disable the standalone Sfantul mod when using this.
# Setting type: Boolean
# Default value: false
Portal Ghost Fix = false

[02 - Networking]

## ZDO send budget based on Valheim's reported queue size. Vanilla leaves the game's 10 KB budget unchanged.
# Setting type: QueueSizeOption
# Default value: KB32
# Acceptable values: Vanilla, KB32, KB48, KB64, KB80
Queue Size = KB32

## 100 = vanilla 20 Hz timer; 75 = 15 Hz; 50 = 10 Hz.
# Setting type: UpdateRateOption
# Default value: Percent100
# Acceptable values: Percent50, Percent75, Percent100
Update Rate = Percent100

[03 - Steamworks]

## Steamworks minimum send rate in KB/s. Keep this below the real upload capacity.
# Setting type: SendRateOption
# Default value: KB256
# Acceptable values: KB150, KB256, KB512, KB768, KB1024
Minimum Send Rate = KB256

## Steamworks maximum send rate in KB/s.
# Setting type: SendRateOption
# Default value: KB1024
# Acceptable values: KB150, KB256, KB512, KB768, KB1024
Maximum Send Rate = KB1024

[04 - Dedicated Server]

## Vanilla follows the server command line; PlayFab forces crossplay; Steamworks disables crossplay.
# Setting type: ForceCrossplayOption
# Default value: Vanilla
# Acceptable values: Vanilla, PlayFab, Steamworks
Force Crossplay = Vanilla

## Dedicated server player limit. Requires restart.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 127
Player Limit = 10

