# Default value: true
AllowWallet = true

## Check that every joining player runs exactly the same SeneaL UI build as this server: the server sends a one-time number with its rules and the client answers with a SHA-256 of its SeneaL-UI.dll signed with that number. Restrict = a player with a changed, older or unknown build (or no answer in 15 s) gets the vanilla limits; Kick = such a player is disconnected; Off = no check. Needs Enforce = true. This stops outdated and edited builds, not a determined cheater: a client can always lie about its own files. Only used while this game hosts the world.
# Setting type: Action
# Default value: Restrict
# Acceptable values: Off, Restrict, Kick
VerifyClients = Restrict

## Extra SeneaL-UI.dll SHA-256 hashes (comma-separated) accepted besides the server's own build, e.g. a preview build some players test. The server log prints the hash of every rejected player. Only used while this game hosts the world.
# Setting type: String
# Default value: 
AllowedBuilds = 

## Accept players whose other mods patch SeneaL UI's own code with Harmony (compatibility patches do this). False = such players fail the check as well. They are always listed in the server log. Only used while this game hosts the world.
# Setting type: Boolean
# Default value: true
AllowForeignPatches = true

