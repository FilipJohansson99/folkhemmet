## Settings file was created by plugin SeneaL API v1.0.1
## Plugin GUID: seneaL.valheim.api

[Bridge]

## Route the game's own messages (top-left, center, unlock and biome banners) to the notice provider, if one is registered.
# Setting type: Boolean
# Default value: true
Notices = true

## Route the game's own confirm, warning and text input windows to the dialog provider, if one is registered.
# Setting type: Boolean
# Default value: true
Dialogs = true

## Show the equipment slots that other mods add through Azumatt's AzuEPI in the UI mod as slots of this API, if AzuEPI is installed. AzuEPI keeps running them; the UI only shows and moves the items.
# Setting type: Boolean
# Default value: true
AzuEPI = true

## Route the AzuEPI API stubs that other mods carry inside their own dll (their methods do nothing) to this API, so such a mod's AddSlot reaches the UI mod (through AzuEPI if it is installed, otherwise emulated). Needs the patcher file in BepInEx/patchers and a game restart.
# Setting type: Boolean
# Default value: true
AzuEPIStubs = true

## Assembly names (comma separated) of mods whose AzuEPI stub is left alone, because the UI mod already supports them itself. Remove a name to route that mod too. Needs a game restart.
# Setting type: String
# Default value: Jewelcrafting,BowsBeforeHoes,BetterArchery,AdventureBackpacks,EpicLoot
AzuEPIStubIgnore = Jewelcrafting,BowsBeforeHoes,BetterArchery,AdventureBackpacks,EpicLoot

[Debug]

## Log every routed notice and dialog.
# Setting type: Boolean
# Default value: false
Verbose = false

