## Settings for ValheimServerTweaks (our custom mod). Edit here, in the server project:
## start-server.ps1 copies this file to the server and Play.bat copies it to every player.

[Drops]

## Stone from rocks, ore deposits and the ground is multiplied by this. Server controlled.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
StoneMultiplier = 3

## Item names (prefab names) that count as stone, comma separated. Server controlled.
# Setting type: String
# Default value: Stone,Grausten,BlackMarble
StoneItems = Stone,Grausten,BlackMarble

## Wood from trees, logs, stumps and branches is multiplied by this. Server controlled.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 100
WoodMultiplier = 2

## Item names (prefab names) that count as wood, comma separated (RoundLog = core wood). Server controlled.
# Setting type: String
# Default value: Wood,FineWood,RoundLog,ElderBark,YggdrasilWood,Blackwood
WoodItems = Wood,FineWood,RoundLog,ElderBark,YggdrasilWood,Blackwood

[Items]

## Max stack size of every stackable item is multiplied by this (2 = wood stacks to 100 instead of 50). Server controlled.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0.1 to 100
StackSizeMultiplier = 2

[Map]

## Share custom-UI pins and import existing local pins; save them on the server with a backup.
## Personal death and bed markers are excluded. Applies after server and client restart.
SharedPersistentPins = true

## Multiplier for how far around you the map gets revealed (vanilla radius is 100 m, so 3 = 300 m).
## Server controlled: the server's value is sent to every player when they join.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0.1 to 20
ExploreRadiusMultiplier = 3

## Force every player's position to be visible on the map for everyone.
## Server controlled: enforced by the server, works even for players without the mod.
# Setting type: Boolean
# Default value: true
AlwaysShowPlayersOnMap = true

[Buildings]

## Torches (including held torches), braziers, campfires and hearths use no fuel.
## Smelters and charcoal kilns keep their normal resource costs.
InfiniteLightFuel = true

## Built pieces take no damage from monsters (players can still damage and deconstruct them).
## Server controlled: the server's value is sent to every player when they join.
# Setting type: Boolean
# Default value: true
ProtectFromEnemies = true

## Also make ships and carts immune to monsters (e.g. serpents). Server controlled.
# Setting type: Boolean
# Default value: false
AlsoProtectShipsAndCarts = false

[Crafting]

## Repair all eligible carried equipment when opening a usable station.
## Normal station type, level, roof and fire requirements still apply.
AutoRepair = true

## Twice the covered building area: radius multiplied by sqrt(2).
## A standard 20 m workbench reaches about 28.3 m. Other station ranges are unchanged.
WorkbenchAreaMultiplier = 2

## Twice as many bronze nails per craft; ingredient costs are unchanged.
BronzeNailsMultiplier = 2

[Textures]

## Client only. Load replacement textures from the texture folder.
# Setting type: Boolean
# Default value: true
Enabled = true

## Client only. Folder with replacement textures. Empty = the 'textures' folder next to this mod's dll.
# Setting type: String
# Default value: 
TextureFolder = 

## Client only. Where the tex_dump console command writes the original textures. Empty = 'texture-dumps' next to this mod's dll.
# Setting type: String
# Default value: 
DumpFolder = 

[Audio]

## Client only. Load optional sound-effect and music replacements from the audio folder.
Enabled = true

[Bosses]

## Client display name only; Fader's internal identity and progression remain unchanged.
FaderDisplayName = Jimpan
